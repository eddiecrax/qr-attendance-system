<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QR Attendance - Student attendance scanning">
  <title>Mark Attendance — QR Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="scan-wrapper">
    <div class="scan-card">
      <div class="scan-icon">🛡️</div>
      <h1>Mark Attendance</h1>
      <p id="sessionInfo" class="session-name">Loading session...</p>

      <div id="scanAlert"></div>

      <div id="scanForm" style="display:none">
        <div class="form-group">
          <label for="fullName">Your Full Name <span style="color:var(--red)">*</span></label>
          <input type="text" id="fullName" class="form-input" placeholder="e.g. Alex Morgan" required autofocus autocomplete="name">
        </div>
        <div class="form-group" style="margin-top: 14px;">
          <label for="studentEmail">Email / Organization <span style="color:var(--text-muted); font-weight:normal">(Optional)</span></label>
          <input type="email" id="studentEmail" class="form-input" placeholder="e.g. alex@example.com" autocomplete="email">
        </div>
        <button id="markBtn" class="btn btn-success btn-block btn-lg" onclick="markAttendance()" style="margin-top: 20px;">
          ✅ Mark Attendance
        </button>
      </div>

      <div id="successView" style="display:none; text-align:center; padding:20px 0;">
        <div style="font-size:64px; margin-bottom:12px;">🎉</div>
        <h2 id="successName" style="margin-bottom:6px;"></h2>
        <p id="successDetail" style="color:var(--text-secondary); font-size:14px;"></p>
        <div style="margin-top: 18px; font-size: 11px; color: var(--accent); background: rgba(0,210,255,0.1); padding: 8px 12px; border-radius: 6px; display: inline-block;">
          🔒 Verification Signed & Logged
        </div>
      </div>

      <div id="errorView" style="display:none; text-align:center; padding:20px 0;">
        <div style="font-size:64px; margin-bottom:12px;">❌</div>
        <h2 id="errorTitle" style="color:var(--red); margin-bottom:6px;"></h2>
        <p id="errorDetail" style="color:var(--text-secondary); font-size:14px; margin-bottom: 16px;"></p>
        <button class="btn btn-secondary btn-sm" onclick="resetForm()">Try Again</button>
      </div>

      <p style="text-align:center; margin-top:28px; font-size:12px; color:var(--text-muted)">
        🛡️ QR Attendance System — Cybersecurity Audit Protected
      </p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    function resetForm() {
      document.getElementById('errorView').style.display = 'none';
      document.getElementById('scanForm').style.display = 'block';
      const btn = document.getElementById('markBtn');
      btn.disabled = false;
      btn.innerHTML = '✅ Mark Attendance';
    }

    async function init() {
      if (!token) {
        document.getElementById('sessionInfo').textContent = '';
        document.getElementById('scanAlert').innerHTML = '<div class="alert alert-error">⚠️ Invalid session link. Please scan a valid session QR code.</div>';
        return;
      }

      try {
        const res = await fetch(`/api/sessions/verify/${token}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        if (!data.is_active) {
          document.getElementById('sessionInfo').textContent = data.title;
          document.getElementById('scanAlert').innerHTML = '<div class="alert alert-error">⚠️ This session is locked/inactive.</div>';
          return;
        }

        if (data.expired) {
          document.getElementById('sessionInfo').textContent = data.title;
          document.getElementById('scanAlert').innerHTML = '<div class="alert alert-error">⚠️ This session QR code has expired.</div>';
          return;
        }

        document.getElementById('sessionInfo').textContent = '📚 ' + data.title;
        
        // Check if already marked on this phone/browser
        const savedName = localStorage.getItem('marked_' + token);
        if (savedName) {
          document.getElementById('scanForm').style.display = 'none';
          document.getElementById('successView').style.display = 'block';
          document.getElementById('successName').textContent = `Welcome back, ${savedName}!`;
          document.getElementById('successDetail').textContent = `Your attendance for "${data.title}" was already recorded from this device.`;
          return;
        }

        document.getElementById('scanForm').style.display = 'block';
      } catch (err) {
        document.getElementById('sessionInfo').textContent = '';
        document.getElementById('scanAlert').innerHTML = `<div class="alert alert-error">⚠️ ${err.message}</div>`;
      }
    }

    async function markAttendance() {
      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();
      
      if (!name) {
        alert('Please enter your full name');
        return;
      }

      const btn = document.getElementById('markBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Processing...';

      try {
        const res = await fetch('/api/attendance/mark', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, name, email })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        // Save locally to block re-submitting on this device
        localStorage.setItem('marked_' + token, data.student_name);

        document.getElementById('scanForm').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
        document.getElementById('successName').textContent = `Welcome, ${data.student_name}!`;
        document.getElementById('successDetail').textContent = `Attendance recorded for "${data.session_title}" at ${data.timestamp}`;
      } catch (err) {
        document.getElementById('scanForm').style.display = 'none';
        document.getElementById('errorView').style.display = 'block';
        document.getElementById('errorTitle').textContent = 'Unable to Record';
        document.getElementById('errorDetail').textContent = err.message;
      }
    }

    document.getElementById('fullName').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') markAttendance();
    });

    init();
  </script>
</body>
</html>
